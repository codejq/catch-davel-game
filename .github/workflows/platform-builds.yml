name: Cross-platform builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: catch-davel-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release for tagged builds
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Catch Davel ${{ github.ref_name }}" --generate-notes

  web:
    name: Offline web
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run game:build
      - name: Package offline web build
        run: cd game/dist && zip -r ../../catch-davel-web-${{ github.ref_name }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: catch-davel-web
          path: game/dist
          if-no-files-found: error
      - name: Add web build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "catch-davel-web-${{ github.ref_name }}.zip" --repo "${{ github.repository }}" --clobber

  desktop:
    name: ${{ matrix.name }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS native
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: game
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Catch Davel ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: catch-davel-${{ runner.os }}-${{ runner.arch }}
          path: |
            game/src-tauri/target/**/release/bundle/**
            game/src-tauri/target/release/bundle/**
          if-no-files-found: error
