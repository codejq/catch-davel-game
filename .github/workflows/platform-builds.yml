name: Cross-platform builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: catch-davel-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release for tagged builds
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Catch Davel ${{ github.ref_name }}" --generate-notes

  web:
    name: Offline web
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run game:build
      - name: Package offline web build
        run: cd game/dist && zip -r ../../catch-davel-web-${{ github.ref_name }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: catch-davel-web
          path: game/dist
          if-no-files-found: error
      - name: Add web build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "catch-davel-web-${{ github.ref_name }}.zip" --repo "${{ github.repository }}" --clobber

  desktop:
    name: ${{ matrix.name }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS native
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build desktop bundles
        if: runner.os != 'Windows'
        run: npm run game:tauri:build
      - name: Build Windows frontend
        if: runner.os == 'Windows'
        working-directory: game
        run: npx vite build
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: cargo build --release --manifest-path game/src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: catch-davel-${{ runner.os }}-${{ runner.arch }}
          path: |
            game/src-tauri/target/**/release/bundle/**
            game/src-tauri/target/release/bundle/**
            game/src-tauri/target/release/quantum-catch-davel.exe
          if-no-files-found: error
      - name: Add Windows executable to GitHub Release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: game/src-tauri/target/release/quantum-catch-davel.exe
          fail_on_unmatched_files: true
      - name: Add Linux packages to GitHub Release
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            game/src-tauri/target/release/bundle/appimage/*.AppImage
            game/src-tauri/target/release/bundle/deb/*.deb
            game/src-tauri/target/release/bundle/rpm/*.rpm
          fail_on_unmatched_files: true
      - name: Add macOS packages to GitHub Release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: game/src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true

  android:
    name: Android ARM64 APK
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm ci
      - name: Build ARM64 debug APK
        working-directory: game
        run: npx tauri android build --debug --apk --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: catch-davel-Android-ARM64
          path: game/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Add APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: game/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
