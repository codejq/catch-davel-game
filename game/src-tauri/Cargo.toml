[package]
name = "quantum-catch-davel"
version = "0.1.1"
description = "Quantum Billing Catch Davel desktop and mobile shell"
authors = ["Quantum Billing Catch Davel contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "quantum_catch_davel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-fs = "=2.5.1"
