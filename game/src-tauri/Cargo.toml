[package]
name = "quantum-zama-sniper"
version = "0.1.8"
description = "Quantum Billing Zama Sniper desktop and mobile shell"
authors = ["Quantum Billing Zama Sniper contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "quantum_zama_sniper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-fs = "=2.5.1"
